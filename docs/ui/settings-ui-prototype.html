<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>设置窗口 UI 原型 — 小猫桌面宠物</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  body { background: #eceef2; padding: 24px 20px 40px; display: flex; justify-content: center; color: #1d1d1f; }
  html[data-theme="dark"] body { background: #141416; color: #f2f2f7; }

  .page { width: 720px; }

  .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; font-size: 12.5px; color: #5a6070; flex-wrap: wrap; }
  html[data-theme="dark"] .toolbar { color: #9a9a9f; }
  .seg { display: flex; border: 1px solid #cfd4dd; border-radius: 7px; overflow: hidden; background: #fff; }
  html[data-theme="dark"] .seg { background: #2e2e30; border-color: #46464a; }
  .seg button { border: 0; background: transparent; padding: 5px 11px; font-size: 12.5px; color: #5a6070; cursor: pointer; font-family: inherit; }
  html[data-theme="dark"] .seg button { color: #b9b9be; }
  .seg button.on { background: #4a7fd4; color: #fff; }
  .spacer { flex: 1; }

  .win { width: 720px; height: 604px; background: #fff; border: 1px solid #d5d9e0; border-radius: 10px;
         box-shadow: 0 14px 34px rgba(20, 30, 50, .14); display: flex; flex-direction: column; overflow: hidden; }
  html[data-theme="dark"] .win { background: #252527; border-color: #3a3a3c; box-shadow: 0 14px 34px rgba(0, 0, 0, .5); }

  .titlebar { height: 38px; flex: 0 0 38px; display: flex; align-items: center; justify-content: space-between;
              padding: 0 13px; background: #f7f8fa; border-bottom: 1px solid #e5e7eb; font-size: 13px; }
  html[data-theme="dark"] .titlebar { background: #202022; border-color: #3a3a3c; }
  .titlebar .name { font-weight: 500; }
  .titlebar .btns { display: flex; gap: 15px; color: #9aa0a9; font-size: 13px; }

  .main { flex: 1; display: flex; min-height: 0; }

  .nav { width: 150px; flex: 0 0 150px; background: #fafbfc; border-right: 1px solid #e5e7eb; padding: 10px 8px;
         display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
  html[data-theme="dark"] .nav { background: #202022; border-color: #3a3a3c; }
  .nav button { text-align: left; border: 0; background: transparent; padding: 7px 10px; border-radius: 7px;
                font-size: 13px; color: #5a6070; cursor: pointer; font-family: inherit; }
  html[data-theme="dark"] .nav button { color: #b9b9be; }
  .nav button:hover { background: #f0f2f6; }
  html[data-theme="dark"] .nav button:hover { background: #2c2c2f; }
  .nav button.on { background: #e8f0fd; color: #2f6bd0; font-weight: 500; }
  html[data-theme="dark"] .nav button.on { background: #2f4a6e; color: #bcd6ff; }

  .pane { flex: 1; min-width: 0; overflow-y: auto; padding: 18px 22px 24px; }
  .ghead h3 { margin: 0 0 5px; font-size: 15px; font-weight: 500; }
  .ghead p { margin: 0 0 14px; font-size: 12.5px; color: #7c828d; line-height: 1.6; }
  html[data-theme="dark"] .ghead p { color: #9a9a9f; }

  .row { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: 12px; align-items: start;
         padding: 10px 0; border-bottom: 1px solid #eef0f3; font-size: 13px; }
  .row:last-child { border-bottom: 0; }
  html[data-theme="dark"] .row { border-color: #333336; }
  .row > .lbl { color: #4a4f57; padding-top: 4px; }
  html[data-theme="dark"] .row > .lbl { color: #c9c9ce; }
  .ctl { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .inline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .note { font-size: 12px; color: #8a8f98; line-height: 1.5; }
  .hint { font-size: 12px; color: #8a8f98; line-height: 1.6; }
  .err { font-size: 12px; color: #c0392b; }
  html[data-theme="dark"] .err { color: #ff8072; }

  input[type=text], select { border: 1px solid #d5d9e0; border-radius: 7px; padding: 5px 9px; font-size: 13px;
    font-family: inherit; background: #fff; color: #1d1d1f; outline: none; min-width: 0; }
  input[type=text]:focus, select:focus { border-color: #4a7fd4; box-shadow: 0 0 0 3px rgba(74, 127, 212, .14); }
  input[type=text].bad { border-color: #d64545; box-shadow: 0 0 0 3px rgba(214, 69, 69, .13); }
  input[type=text][readonly] { background: #f5f6f8; color: #6e737d; }
  html[data-theme="dark"] input[type=text], html[data-theme="dark"] select { background: #2e2e30; border-color: #46464a; color: #f2f2f7; }
  html[data-theme="dark"] input[type=text][readonly] { background: #29292b; color: #9a9a9f; }
  input[type=checkbox] { width: 15px; height: 15px; accent-color: #4a7fd4; margin: 0; flex: 0 0 auto; }
  input[type=range] { accent-color: #4a7fd4; flex: 1; min-width: 80px; height: 18px; }
  .val { font-size: 12.5px; color: #5a6070; min-width: 66px; text-align: right; font-variant-numeric: tabular-nums; }
  html[data-theme="dark"] .val { color: #b9b9be; }

  button.btn { border: 1px solid #d5d9e0; background: #fff; border-radius: 7px; padding: 5px 12px; font-size: 12.5px;
               color: #3a4048; cursor: pointer; font-family: inherit; white-space: nowrap; }
  button.btn:hover { background: #f4f6f9; border-color: #c3c9d3; }
  button.btn.primary { background: #4a7fd4; border-color: #4a7fd4; color: #fff; }
  button.btn.primary:hover { background: #3f72c3; }
  button.btn:disabled { opacity: .5; cursor: default; }
  html[data-theme="dark"] button.btn { background: #2e2e30; border-color: #46464a; color: #e4e4e9; }
  html[data-theme="dark"] button.btn.primary { background: #4a7fd4; border-color: #4a7fd4; color: #fff; }
  button.link { border: 0; background: transparent; font-size: 12.5px; cursor: pointer; font-family: inherit; padding: 4px 2px; }
  button.link.danger { color: #c0392b; }
  html[data-theme="dark"] button.link.danger { color: #ff8072; }

  .badge { font-size: 11.5px; padding: 2px 7px; border-radius: 999px; white-space: nowrap; line-height: 1.5; }
  .badge.restart { background: #fff3e0; color: #a86400; border: 1px solid #f0cd96; }
  .badge.login { background: #e8f0fd; color: #2f6bd0; border: 1px solid #c3d3ec; }
  html[data-theme="dark"] .badge.restart { background: #3d2f16; color: #ffc46b; border-color: #6b5024; }
  html[data-theme="dark"] .badge.login { background: #253a56; color: #a8caf5; border-color: #3a5a86; }

  .divider { height: 1px; background: #eef0f3; margin: 14px -22px 12px; }
  html[data-theme="dark"] .divider { background: #333336; }
  .subhead { font-size: 12.5px; color: #7c828d; margin: 0 0 10px; }

  .footer { height: 56px; flex: 0 0 56px; border-top: 1px solid #e5e7eb; background: #fafbfc; display: flex;
            align-items: center; justify-content: space-between; padding: 0 16px; gap: 12px; font-size: 12.5px; }
  html[data-theme="dark"] .footer { background: #202022; border-color: #3a3a3c; }
  .footer .l, .footer .r { display: flex; align-items: center; gap: 10px; }
  .msg { color: #2e8b57; }
  .msg.warn { color: #a86400; display: flex; align-items: center; gap: 8px; }
  html[data-theme="dark"] .msg.warn { color: #ffc46b; }

  .legend { margin: 16px 0 0; font-size: 12px; color: #6e737d; line-height: 1.9; }
  html[data-theme="dark"] .legend { color: #9a9a9f; }
  .legend b { font-weight: 500; color: #1d1d1f; }
  html[data-theme="dark"] .legend b { color: #f2f2f7; }
  .legend code { background: #fff; border: 1px solid #e0e3e9; border-radius: 4px; padding: 1px 5px; font-size: 11.5px; }
  html[data-theme="dark"] .legend code { background: #2e2e30; border-color: #46464a; }
</style>
</head>
<body>
<div class="page">

  <div class="toolbar">
    <span>原型预览：</span>
    <span class="seg" id="segTheme">
      <button data-theme="light" class="on">浅色</button>
      <button data-theme="dark">深色</button>
    </span>
    <span class="seg" id="segLang">
      <button data-lang="zh" class="on">中文</button>
      <button data-lang="en">English</button>
    </span>
    <span class="spacer"></span>
    <span>点击左侧分组浏览 · 控件可实际操作</span>
  </div>

  <div class="win">
    <div class="titlebar">
      <span class="name" id="tbTitle">设置 — 小银</span>
      <span class="btns">— □ ×</span>
    </div>
    <div class="main">
      <nav class="nav" id="nav"></nav>
      <div class="pane" id="pane"></div>
    </div>
    <div class="footer">
      <div class="l">
        <button class="link danger" id="btnReset">恢复默认设置</button>
        <span id="msgL"></span>
      </div>
      <div class="r">
        <span id="msgWarn"></span>
        <button class="btn" id="btnCancel">取消</button>
        <button class="btn primary" id="btnApply" disabled>应用</button>
      </div>
    </div>
  </div>

          { id: 'migrate', zh: '迁移并重启', en: 'Migrate & restart' }
        ],
          hintzh: '「导入配置…」会先校验格式并列出将被覆盖的项，确认后才应用；「迁移并重启」仅在数据位置被改动后可点。',
          hinten: 'Import validates the file and lists what will be overwritten before applying. Migrate is enabled only after the data folder changes.' }
      ]
    }
  ];

  var ITEMS = {};
  GROUPS.forEach(function (g) {
    g.items.forEach(function (it) { if (it.k) ITEMS[it.k] = it; });
  });

  var DEFAULTS = {};
  Object.keys(ITEMS).forEach(function (k) { DEFAULTS[k] = ITEMS[k].v; });

  var cur = 'pet';
  var lang = 'zh';
  var vals = Object.assign({}, DEFAULTS);
  var saved = Object.assign({}, DEFAULTS);

  var $nav = document.getElementById('nav');
  var $pane = document.getElementById('pane');
  var $tbTitle = document.getElementById('tbTitle');
  var $msgL = document.getElementById('msgL');
  var $msgWarn = document.getElementById('msgWarn');
  var $btnReset = document.getElementById('btnReset');
  var $btnCancel = document.getElementById('btnCancel');
  var $btnApply = document.getElementById('btnApply');

  function tr(zh, en) { return lang === 'zh' ? zh : en; }
  function subst(s) {
    var out = String(s);
    out = out.replace(/\{name\}/g, vals.petName || DEFAULTS.petName);
    out = out.replace(/\{owner\}/g, vals.ownerName || DEFAULTS.ownerName);
    return out;
  }

  function fmtVal(it, v) {
    var u = { pct: ['%', '%'], sec: [' 秒', ' s'], ms: [' 秒', ' s'], min: [' 分钟', ' min'] };
    if (it.fmt === 'ms') return (Number(v) / 1000).toFixed(1) + (lang === 'zh' ? ' 秒' : ' s');
    if (it.fmt === 'secLong') {
      var m = Math.floor(Number(v) / 60), s = Number(v) % 60;
      if (lang !== 'zh') return (m ? m + ' min ' : '') + s + ' s';
      return (m ? m + ' 分 ' : '') + s + ' 秒';
    }
    if (u[it.fmt]) return v + u[it.fmt][lang === 'zh' ? 0 : 1];
    return String(v);
  }

  function isDisabled(it) {
    if (it.ro) return true;
    if (it.blockedBy && vals[it.blockedBy]) return true;
    if (it.requires && !vals[it.requires]) return true;
    return false;
  }

  function badgeHtml(b) {
    if (!b) return '';
    var txt = b === 'restart' ? tr('重启后生效', 'Restart to apply') : tr('下次登录生效', 'Applies next sign-in');
    return '<span class="badge ' + b + '">' + txt + '</span>';
  }

  function ctlHtml(it) {
    var dis = isDisabled(it) ? ' disabled' : '';
    var v = vals[it.k];

    if (it.t === 'text') {
      var w = Math.max(110, Math.min(220, it.max * 17));
      return '<div class="ctl">'
        + '<input type="text" data-k="' + it.k + '" value="' + esc(v) + '" style="width:' + w + 'px"' + dis + ' />'
        + '<div class="err" data-for="' + it.k + '" hidden></div>'
        + (it.hzh ? '<div class="hint">' + esc(subst(tr(it.hzh, it.hen))) + '</div>' : '')
        + '</div>';
    }

    if (it.t === 'switch') {
      return '<div class="ctl"><label class="inline">'
        + '<input type="checkbox" data-k="' + it.k + '"' + (v ? ' checked' : '') + dis + ' />'
        + '<span class="note">' + esc(subst(tr(it.nzh, it.nen))) + '</span></label>'
        + (it.hzh ? '<div class="hint">' + esc(subst(tr(it.hzh, it.hen))) + '</div>' : '')
        + '</div>';
    }

    if (it.t === 'range') {
      return '<div class="ctl"><div class="inline">'
        + '<input type="range" data-k="' + it.k + '" min="' + it.min + '" max="' + it.max + '" step="' + it.step + '"'
        + ' value="' + v + '"' + dis + ' />'
        + '<span class="val" data-val="' + it.k + '">' + esc(fmtVal(it, v)) + '</span></div>'
        + (it.hzh ? '<div class="hint">' + esc(subst(tr(it.hzh, it.hen))) + '</div>' : '')
        + '</div>';
    }

    if (it.t === 'select') {
      var opts = it.opts.map(function (o) {
        var text = (o.zh || o.en) ? tr(o.zh || o.v, o.en || o.v) : String(o.v);
        return '<option value="' + esc(o.v) + '"' + (String(o.v) === String(v) ? ' selected' : '') + '>' + esc(text) + '</option>';
      }).join('');
      return '<div class="ctl"><select data-k="' + it.k + '" style="max-width:210px"' + dis + '>' + opts + '</select>'
        + (it.hzh ? '<div class="hint">' + esc(subst(tr(it.hzh, it.hen))) + '</div>' : '')
        + '</div>';
    }

    if (it.t === 'path') {
      var btns = (it.btns || []).map(function (b) {
        return '<button class="btn" data-act="' + b.id + '">' + esc(tr(b.zh, b.en)) + '</button>';
      }).join('');
      return '<div class="ctl"><div class="inline">'
        + '<input type="text" data-k="' + it.k + '" value="' + esc(v) + '" readonly style="flex:1;font-size:12px;min-width:220px" />'
        + btns + '</div>'
        + (it.hzh ? '<div class="hint">' + esc(subst(tr(it.hzh, it.hen))) + '</div>' : '')
        + '</div>';
    }

    return '';
  }

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function renderNav() {
    $nav.innerHTML = GROUPS.map(function (g) {
      return '<button data-g="' + g.id + '"' + (g.id === cur ? ' class="on"' : '') + '>' + esc(tr(g.zh, g.en)) + '</button>';
    }).join('');
  }

  function renderPane() {
    var g = GROUPS.filter(function (x) { return x.id === cur; })[0];
    var html = '<div class="ghead"><h3>' + esc(tr(g.zh, g.en)) + '</h3><p>' + esc(tr(g.dzh, g.den)) + '</p></div>';

    g.items.forEach(function (it) {
      if (it.t === 'divider') { html += '<div class="divider"></div>'; return; }
      if (it.t === 'subhead') { html += '<p class="subhead">' + esc(tr(it.zh, it.en)) + '</p>'; return; }
      if (it.t === 'actions') {
        var bs = it.btns.map(function (b) {
          return '<button class="btn" data-act="' + b.id + '">' + esc(tr(b.zh, b.en)) + '</button>';
        }).join('');
        html += '<div class="ctl" style="gap:8px"><div class="inline">' + bs + '</div>'
          + '<div class="hint">' + esc(tr(it.hintzh, it.hinten)) + '</div></div>';
        return;
      }
      html += '<div class="row">'
        + '<div class="lbl">' + esc(tr(it.zh, it.en)) + (it.badge ? ' ' + badgeHtml(it.badge) : '') + '</div>'
        + ctlHtml(it) + '</div>';
    });

    $pane.innerHTML = html;
  }

  function renderFooter() {
    var n = dirtyCount();
    $btnApply.disabled = n === 0;
    $btnCancel.disabled = n === 0;
    var restart = dirtyRestart();
    $msgWarn.innerHTML = restart ? ('<span class="msg warn">' + esc(tr('有 ' + restart + ' 项需重启后生效', restart + ' change(s) need a restart')) + ' <button class="link" data-act="restart-app" style="color:inherit;text-decoration:underline">' + esc(tr('立即重启', 'Restart now')) + '</button></span>') : '';
  }

  function updateTitle() {
    $tbTitle.textContent = tr('设置', 'Settings') + ' — ' + (vals.petName || DEFAULTS.petName);
  }

  function render() { renderNav(); renderPane(); renderFooter(); renderChrome(); updateTitle(); }

  function renderChrome() {
    $btnReset.textContent = tr('恢复默认设置', 'Reset to defaults');
    $btnCancel.textContent = tr('取消', 'Cancel');
    $btnApply.textContent = tr('应用', 'Apply');
  }

  function dirtyKeys() {
    return Object.keys(DEFAULTS).filter(function (k) { return vals[k] !== saved[k]; });
  }
  function dirtyCount() { return dirtyKeys().length; }
  function dirtyRestart() {
    return dirtyKeys().filter(function (k) { return ITEMS[k] && ITEMS[k].badge === 'restart'; }).length;
  }

  function updateValLabel(it, v) {
    var el = $pane.querySelector('[data-val="' + it.k + '"]');
    if (el) el.textContent = fmtVal(it, v);
  }

  function updateEnabled() {
    Object.keys(ITEMS).forEach(function (k) {
      var it = ITEMS[k];
      if (!it.blockedBy && !it.requires) return;
      var el = $pane.querySelector('[data-k="' + k + '"]');
      if (el) el.disabled = isDisabled(it);
    });
  }

  function validateText(it, el) {
    var errEl = $pane.querySelector('.err[data-for="' + it.k + '"]');
    var raw = el.value;
    var clean = raw.replace(/[\u0000-\u001F\u007F]/g, '');
    if (clean.length > it.max) clean = clean.slice(0, it.max);
    if (clean !== raw) el.value = clean;

    var msg = '';
    if (it.k === 'petName') {
      if (!clean.trim()) { msg = tr('名字不能为空，将回退为默认「小银」', 'Name cannot be blank — will fall back to “小银”'); }
    }
    el.classList.toggle('bad', !!msg);
    if (errEl) { errEl.hidden = !msg; errEl.textContent = msg; }
    return clean;
  }

  function onInput(e) {
    var el = e.target;
    var k = el.getAttribute('data-k');
    if (!k) return;
    var it = ITEMS[k];
    if (!it) return;
    var v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'range') v = Number(el.value);
    else v = el.value;

    if (it.t === 'text') v = validateText(it, el);
    vals[k] = v;

    if (k === 'theme') applyThemePreview(v === 'auto' ? autoTheme() : v);
    if (k === 'language') { setLang(String(v).indexOf('zh') === 0 ? 'zh' : 'en'); render(); return; }

    if (it.t === 'range') updateValLabel(it, v);
    if (k === 'petName' || k === 'ownerName') { updateTitle(); refreshNames(); }
    updateEnabled();
    renderFooter();
  }

  function autoTheme() {
    return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }

  function applyThemePreview(th) {
    document.documentElement.setAttribute('data-theme', th);
    var seg = document.getElementById('segTheme');
    Array.prototype.forEach.call(seg.children, function (x) {
      x.classList.toggle('on', x.getAttribute('data-theme') === th);
    });
  }

  function setLang(code) {
    lang = code;
    document.documentElement.setAttribute('lang', code === 'zh' ? 'zh-CN' : 'en');
    var seg = document.getElementById('segLang');
    Array.prototype.forEach.call(seg.children, function (x) {
      x.classList.toggle('on', x.getAttribute('data-lang') === code);
    });
  }

  function refreshNames() {
    if (cur !== 'pet') return;
    var el = $pane.querySelector('[data-k="showNameInBubble"]');
    if (!el) return;
    var note = el.parentNode.querySelector('.note');
    if (note) note.textContent = subst(tr(ITEMS.showNameInBubble.nzh, ITEMS.showNameInBubble.nen));
  }

  $nav.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-g]');
    if (!b) return;
    cur = b.getAttribute('data-g');
    renderNav();
    renderPane();
    $pane.scrollTop = 0;
  });

  $pane.addEventListener('input', onInput);
  $pane.addEventListener('change', onInput);

  $pane.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]');
    if (!b) return;
    var a = b.getAttribute('data-act');
    if (a === 'browse') flash(tr('已打开系统文件夹选择对话框（原型演示）', 'Folder picker would open here (prototype)'));
    else if (a === 'open') flash(tr('已在资源管理器中定位到数据目录（原型演示）', 'Would open the folder in Explorer (prototype)'));
    else if (a === 'export') flash(tr('已导出 cat-pet-config-20261015.json（原型演示）', 'Would export cat-pet-config-20261015.json (prototype)'));
    else if (a === 'import') flash(tr('校验通过，即将列出 4 项将被覆盖（原型演示）', 'Validated — would list 4 overwritten items (prototype)'));
    else if (a === 'migrate') flash(tr('将先复制数据再切换目录并重启（原型演示）', 'Would copy data, switch folder and restart (prototype)'));
  });

  $btnApply.addEventListener('click', function () {
    saved = Object.assign({}, vals);
    renderFooter();
    flash(tr('已保存到 config.json', 'Saved to config.json'));
  });

  $btnCancel.addEventListener('click', function () {
    vals = Object.assign({}, saved);
    renderPane();
    renderFooter();
    updateTitle();
    flash(tr('已放弃未保存的改动', 'Unsaved changes discarded'));
  });

  $btnReset.addEventListener('click', function () {
    vals = Object.assign({}, DEFAULTS);
    renderPane();
    renderFooter();
    updateTitle();
    flash(tr('已恢复全部默认设置（原型中不弹出确认对话框）', 'All settings reset to defaults (no confirm dialog in prototype)'), true);
  });

  $msgWarn.addEventListener('click', function (e) {
    if (e.target.getAttribute('data-act') === 'restart-app') flash(tr('将重启应用（原型演示）', 'Would restart the app (prototype)'));
  });

  var flashTimer = null;
  function flash(text, warn) {
    $msgL.textContent = text;
    $msgL.className = warn ? 'msg warn' : 'msg';
    clearTimeout(flashTimer);
    flashTimer = setTimeout(function () { $msgL.textContent = ''; }, 2600);
  }

  document.getElementById('segTheme').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-theme]');
    if (!b) return;
    var th = b.getAttribute('data-theme');
    applyThemePreview(th);
    vals.theme = th;
    saved.theme = th;
    renderFooter();
  });

  document.getElementById('segLang').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-lang]');
    if (!b) return;
    setLang(b.getAttribute('data-lang'));
    vals.language = lang === 'zh' ? 'zh-CN' : 'en-US';
    saved.language = vals.language;
    render();
  });

  render();
})();
</script>
</body>
</html>
