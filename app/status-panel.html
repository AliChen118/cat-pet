<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:;" />
  <title>状态面板</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: transparent;
      user-select: none; -webkit-user-select: none;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    :root { --track: #ececec; --txt: #4a4a4a; --sub: #9a9a9a; }
    body.dark { --track: #3c3e44; --txt: #e6e6ea; --sub: #9aa0a6; }

    #panel {
      margin: 10px 8px;
      padding: 14px 14px 12px;
      border-radius: 14px;
      background: rgba(250, 250, 248, 0.97);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.18);
      box-sizing: border-box;
      color: var(--txt);
    }
    body.dark #panel { background: rgba(46, 48, 54, 0.97); box-shadow: 0 8px 28px rgba(0, 0, 0, 0.5); }

    .head { display: flex; align-items: center; gap: 8px; }
    .name { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
    .lv {
      padding: 1px 8px; border-radius: 9px;
      background: #5b8def; color: #fff;
      font-size: 11px; font-weight: 700; line-height: 16px;
    }

    .speech {
      margin: 9px 2px 11px;
      font-size: 11.5px; line-height: 1.5; color: var(--sub);
      min-height: 17px;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .speech:empty { margin: 0 2px 6px; min-height: 0; }

    .stat { display: flex; align-items: center; gap: 7px; margin: 9px 0; }
    .stat .ico { font-size: 13px; width: 16px; text-align: center; }
    .stat .label { font-size: 12px; width: 42px; flex: none; }
    .stat .track {
      flex: 1; height: 7px; border-radius: 4px;
      background: var(--track); overflow: hidden;
    }
    .stat .fill { height: 100%; border-radius: 4px; width: 0%; transition: width 0.3s ease; }
    .stat .val { font-size: 12px; width: 30px; text-align: right; font-variant-numeric: tabular-nums; }

    .c-mood  { background: #f6bd4a; }
    .c-food  { background: #7dc855; }
    .c-energy{ background: #f5923e; }
    .c-clean { background: #4fc3c7; }
    .c-aff   { background: #f5768f; }

    /* 属性档位徽章：只显示非「正常」档，全正常时整行隐藏 */
    .tags { display: flex; flex-wrap: wrap; gap: 5px; margin: 0 2px 10px; }
    .tags:empty { display: none; }
    .tag {
      padding: 1px 7px; border-radius: 8px;
      font-size: 10.5px; line-height: 15px; white-space: nowrap;
      background: var(--track); color: var(--sub);
    }
    .tag.t-critical { background: #fde3e0; color: #c0392b; }
    .tag.t-low { background: #fdf1dc; color: #b3771a; }
    .tag.t-good { background: #e2f3e2; color: #3f8b46; }
    body.dark .tag.t-critical { background: #4a2f2c; color: #ff9a8c; }
    body.dark .tag.t-low { background: #443a24; color: #e8bb6a; }
    body.dark .tag.t-good { background: #2b4030; color: #8fd39a; }

    .sec { margin: 14px 2px 8px; font-size: 11.5px; color: var(--sub); }
    .acts { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
    .acts button {
      padding: 8px 0; border: none; border-radius: 10px;
      background: #fff; color: var(--txt);
      font-size: 12.5px; font-family: inherit;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
      cursor: pointer;
    }
    .acts button:hover { background: #eef3fc; }
    .acts button:active { transform: scale(0.97); }
    body.dark .acts button { background: #3a3d45; }
    body.dark .acts button:hover { background: #454a55; }
  </style>
</head>
<body>
  <div id="panel">
    <div class="head">
      <div class="name" id="p-name">—</div>
      <div class="lv" id="p-age"></div>
    </div>
    <div class="speech" id="p-speech"></div>
    <div class="tags" id="p-tags"></div>

    <div class="stat"><span class="ico">😊</span><span class="label" data-i18n="panel.mood">心情</span>
      <div class="track"><div class="fill c-mood" id="f-happiness"></div></div><span class="val" id="v-happiness">80</span></div>
    <div class="stat"><span class="ico">🍚</span><span class="label" data-i18n="panel.food">饱食</span>
      <div class="track"><div class="fill c-food" id="f-hunger"></div></div><span class="val" id="v-hunger">80</span></div>
    <div class="stat"><span class="ico">⚡</span><span class="label" data-i18n="panel.energy">体力</span>
      <div class="track"><div class="fill c-energy" id="f-energy"></div></div><span class="val" id="v-energy">80</span></div>
    <div class="stat"><span class="ico">🫧</span><span class="label" data-i18n="panel.clean">清洁</span>
      <div class="track"><div class="fill c-clean" id="f-cleanliness"></div></div><span class="val" id="v-cleanliness">80</span></div>
    <div class="stat"><span class="ico">💗</span><span class="label" data-i18n="panel.affinity">好感</span>
      <div class="track"><div class="fill c-aff" id="f-affinity"></div></div><span class="val" id="v-affinity">10</span></div>

    <div class="sec" id="p-sec">互动</div>
    <div class="acts">
      <button data-act="pet">🐾 <span data-i18n="tray.pet">抚摸</span></button>
      <button data-act="feed">🍚 <span data-i18n="tray.feed">喂食</span></button>
      <button data-act="play">🎾 <span data-i18n="tray.play">逗玩</span></button>
      <button data-act="call">📢 <span data-i18n="tray.call">呼喊</span></button>
      <button data-act="bath">🛁 <span data-i18n="tray.bath">洗澡</span></button>
    </div>
  </div>

  <script src="engine/i18n.js"></script>
  <script src="status-panel.js"></script>
</body>
</html>
